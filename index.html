<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Arcane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e6cf9f">
<meta name="description" content="Browse and search every item in Codex Arcane.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Codex Arcane">
<meta property="og:title" content="Codex Arcane">
<meta property="og:description" content="Browse and search every item in Codex Arcane.">
<meta property="og:url" content="https://codex-arcane.github.io/">
<meta property="og:image" content="https://codex-arcane.github.io/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://codex-arcane.github.io/assets/og-image.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top sticky">
  <div class="titlebar">
    <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Home" width="64" height="58"></a>
    <h1 class="wordmark"><a href="index.html">Codex Arcane</a></h1>
    <div class="gsearch" role="search">
      <svg class="gs-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="gs" type="search" placeholder="Search the whole site" autocomplete="off" enterkeyhint="search" aria-label="Search the whole site" aria-controls="gs-results">
      <div id="gs-results" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div id="acct"></div>
  </div>
</header>

<div id="scrim" hidden></div>
<nav id="drawer" aria-label="Categories">
  <div class="drawer-head">
    <strong>Browse</strong>
    <button id="menu-close" class="icon-btn" type="button" aria-label="Close menu">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="menu-list"></div>
  <div id="drawer-acct" class="drawer-acct"></div>
</nav>
<div id="banner" hidden>
  <span>You're browsing as a guest. Your favorites and settings are saved only in this browser. <a href="account.html?next=index.html">Create an account</a> to keep them on any device.</span>
  <button id="dismiss">Dismiss</button>
</div>

<main>
  <h2 id="crumb" class="crumb" hidden></h2>
  <div class="tools" hidden>
    <input id="q" type="search" placeholder="Filter this category" aria-label="Filter items in this category">
    <select id="type" aria-label="Filter by how it's obtained"></select>
    <button id="adv-btn" class="adv-btn" type="button" aria-expanded="false" aria-controls="adv-panel">Sort &amp; filters</button>
    <label class="chk"><input type="checkbox" id="favonly"> Favorites only</label>
    <div id="adv-panel" class="adv-body" hidden>
      <label>Sort
        <select id="sort">
          <option value="name">Name A to Z</option>
          <option value="name-desc">Name Z to A</option>
          <option value="hi">Highest stat value</option>
          <option value="lo">Lowest stat value</option>
        </select>
      </label>
      <div class="statpick">
        <input id="stat-q" type="text" placeholder="Search stats (any stat)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="stat-list" aria-label="Filter by stat">
        <button id="stat-clear" class="stat-clear" type="button" aria-label="Clear stat" hidden>&times;</button>
        <div id="stat-list" role="listbox" aria-label="Stats" hidden></div>
      </div>
      <label class="dyef">Dye <input id="dye" list="dye-list" placeholder="e.g. A30" autocomplete="off"></label>
      <datalist id="dye-list"></datalist>
    </div>
    <div class="views" role="group" aria-label="Layout">
      <button id="v-grid" aria-pressed="true">Slots</button>
      <button id="v-list" aria-pressed="false">List</button>
    </div>
    <span id="count" aria-live="polite"></span>
  </div>
  <div id="items"></div>
  <button id="more" hidden>Show more</button>
</main>

<div id="cmp-tray" hidden role="region" aria-label="Compare"></div>

<dialog id="cmp"><div id="cmp-body"></div><form method="dialog"><button type="button" id="cmp-clear">Clear compare</button> <button>Close</button></form></dialog>

<dialog id="dlg"><div id="dlg-body"></div><form method="dialog"><button>Close</button></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
